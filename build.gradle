// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        jcenter()
        mavenCentral()
    }

    dependencies {
        classpath "io.codearte.gradle.nexus:gradle-nexus-staging-plugin:0.11.0"
        classpath 'com.android.tools.build:gradle:4.2.2'
    }
}

configure(allprojects) { project ->

    version = VERSION_NAME
    group = GROUP
    buildscript {
        repositories {
            google()
            jcenter()
            mavenCentral()
            maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
            mavenLocal()
        }
    }
}

project.ext.preDexLibs = !project.hasProperty('disablePreDex')

subprojects {

    group = 'org.smartregister'

    ext.androidToolsBuildGradle     = '3.1.4'
    ext.androidBuildToolsVersion    = '29.0.3'
    ext.androidMinSdkVersion        = 21
    ext.androidCompileSdkVersion    = 29
    ext.androidTargetSdkVersion     = 29

    ext.androidAnnotationsVersion = '3.0.1'
    ext.androidAnnotationsAPIVersion = '3.0.1'

    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://acra.googlecode.com/svn/repository/releases" }
        maven { url "https://repo.maven.apache.org/maven2" }
        maven { url "https://cloudant.github.io/cloudant-sync-eap/repository" }
        maven { url "https://s3.amazonaws.com/repo.commonsware.com" }
        mavenLocal()
    }

    configurations.all {
        resolutionStrategy.force 'net.zetetic:sqlcipher-android:4.5.4'
        resolutionStrategy.force 'androidx.annotation:annotation:1.0.0'
        resolutionStrategy.force 'androidx.annotation:annotation-experimental:1.0.0'
        resolutionStrategy.force 'androidx.work:work-runtime:2.4.0'
        resolutionStrategy.force 'com.google.android.material:material:1.0.0'
        resolutionStrategy.force 'androidx.core:core:1.6.0'
        resolutionStrategy.force 'androidx.appcompat:appcompat:1.0.0'
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.google.android.gms" &&
                    details.requested.name.startsWith("play-services-measurement")) {
                details.useVersion "21.3.0"
            }
        }
    }

    tasks.withType(Test).configureEach {
        enabled = false
    }

    // Improve build server performance by allowing disabling of pre-dexing
    // (see http://tools.android.com/tech-docs/new-build-system/tips#TOC-Improving-Build-Server-performance.)
    project.plugins.whenPluginAdded { plugin ->
        if ("com.android.build.gradle.AppPlugin".equals(plugin.class.name)) {
            project.android.dexOptions.preDexLibraries = rootProject.ext.preDexLibs
        } else if ("com.android.build.gradle.LibraryPlugin".equals(plugin.class.name)) {
            project.android.dexOptions.preDexLibraries = rootProject.ext.preDexLibs
        }
    }
}

apply plugin : 'java'
apply plugin : 'build-dashboard'
apply plugin: 'io.codearte.nexus-staging'

buildDashboard {
    reports.html.setDestination(file("build/"))
}

test.reports.html.enabled = false
test.reports.junitXml.enabled = false


def isReleaseBuild() {
    return version.contains("SNAPSHOT") == false
}
